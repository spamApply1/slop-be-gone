<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SBG Dashboard</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Slop Be Gone</p>
          <h1>Local repository hygiene dashboard</h1>
          <p class="subtitle">
            Scan any repository path, inspect violations in a readable UI, and
            optionally review the active manifest and a brief summary.
          </p>
        </div>
      </header>

      <section class="panel controls-panel">
        <form id="scan-form" class="scan-form">
          <label for="repo-path">Repository path</label>
          <input id="repo-path" name="repo-path" type="text" value="." placeholder="e.g. . or /path/to/repo">

          <label for="manifest-path">Manifest path (optional)</label>
          <input id="manifest-path" name="manifest-path" type="text" placeholder="leave blank for the default manifest">

          <div class="checkbox-row">
            <label class="checkbox-pill">
              <input id="show-summary" type="checkbox" checked>
              <span>Show summary</span>
            </label>
            <label class="checkbox-pill">
              <input id="show-manifest" type="checkbox">
              <span>Show current manifest</span>
            </label>
          </div>

          <div class="button-row">
            <button type="submit">Scan repository</button>
            <button type="button" id="refresh-manifest" class="secondary">Refresh manifest</button>
          </div>
        </form>

        <div class="pattern-form">
          <label for="pattern-name">Pattern name</label>
          <input id="pattern-name" name="pattern-name" type="text" placeholder="e.g. custom-placeholder">

          <label for="pattern-text">Pattern (plain text or regex)</label>
          <input id="pattern-text" name="pattern-text" type="text" placeholder="e.g. TODO or ^TODO">

          <div class="pattern-meta-row">
            <label class="select-field">
              <span>Rule kind</span>
              <select id="pattern-kind">
                <option value="placeholder-comments">placeholder-comments</option>
                <option value="marker-spam">marker-spam</option>
                <option value="long-lines">long-lines</option>
              </select>
            </label>
            <label class="select-field">
              <span>Match mode</span>
              <select id="pattern-type">
                <option value="plain_text">Plain text</option>
                <option value="regex">Regex</option>
              </select>
            </label>
          </div>

          <label for="output-manifest">Save manifest path (optional)</label>
          <input
            id="output-manifest"
            name="output-manifest"
            type="text"
            placeholder="leave blank to update the current manifest"
          >

          <div class="button-row">
            <button type="button" id="preview-pattern" class="secondary">Preview pattern</button>
            <button type="button" id="save-pattern">Save pattern</button>
          </div>

          <div id="pattern-preview-summary" class="substatus">No preview yet.</div>
          <div id="pattern-preview-list" class="summary-list"></div>
        </div>

        <div id="status" class="status">Ready to scan.</div>
      </section>

      <section class="panels-grid">
        <section id="summary-panel" class="panel hidden">
          <div class="panel-header">
            <h2>Summary</h2>
          </div>
          <div id="summary-list" class="summary-list"></div>
        </section>

        <section id="manifest-panel" class="panel hidden">
          <div class="panel-header">
            <h2>Current manifest</h2>
          </div>
          <pre id="manifest-output" class="code-block">{}</pre>
        </section>
      </section>

      <section id="drilldown-panel" class="panel drilldown-panel">
        <div class="panel-header">
          <h2>Violation details</h2>
        </div>
        <div id="drilldown-content" class="drilldown-content"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Violations</h2>
          <span id="violations-count" class="count-pill">0 findings</span>
        </div>
        <div id="violations-list" class="violations-list"></div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
