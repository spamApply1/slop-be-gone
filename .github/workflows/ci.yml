name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Validate SBG manifest
        run: python -m sbg.cli validate .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: SBG self-hygiene (dogfood)
        run: python -m sbg.cli check .
